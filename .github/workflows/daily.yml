name: whale40

on:
  schedule:
    - cron: "37 1 * * *"
 # UTC 02:00 = 한국시간 오전 11:00
  workflow_dispatch:
    inputs:
      inspect:
        description: "구조 점검만 실행 (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: whale40
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 한글 폰트 설치 (PDF용)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum || true

      - run: pip install requests reportlab

      - name: 랭킹 계산 + 공시 감시 + 리포트
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.inspect }}" = "true" ]; then
            python whale40.py --inspect
          else
            python whale40.py
          fi

      - name: 결과 저장
        if: always()
        run: |
          git config user.name "whale40-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A data report 2>/dev/null || true
          git diff --cached --quiet || git commit -m "daily $(date -u +%F)"
          git pull --rebase --autostash || true
          git push || true
