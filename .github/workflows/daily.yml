name: whale40

on:
  schedule:
    - cron: "0 2 * * 2-6"   # UTC 02:00 = 한국시간 오전 11:00 (화~토 = 미국 월~금 마감분)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: whale40
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: 랭킹 계산 + 공시 감시 + 리포트
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEC_PROXY: ${{ secrets.SEC_PROXY }}
          SEC_PROXY_KEY: ${{ secrets.SEC_PROXY_KEY }}

        run: python whale40.py

      - name: 결과 저장
        run: |
          git config user.name "whale40-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A data report
          git diff --cached --quiet || git commit -m "daily $(date -u +%F)"
          git pull --rebase --autostash || true
          git push
