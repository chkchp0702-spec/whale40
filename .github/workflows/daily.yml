name: whale40 daily

on:
  schedule:
    # 한국시간 10:37 · 11:07 · 11:43 · 13:17 — GitHub이 예약을 누락해도 하나는 걸리도록
    - cron: "37 1 * * *"
    - cron: "7 2 * * *"
    - cron: "43 2 * * *"
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: whale40
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: 오늘 이미 보냈는지 확인
        id: guard
        run: |
          TODAY=$(date -u +%F)
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "report/${TODAY}.md" ]; then
            echo "오늘(${TODAY}) 리포트가 이미 있어 건너뜁니다"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: 한글 폰트 설치 (PDF용)
        if: steps.guard.outputs.skip != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum || true

      - name: 라이브러리 설치
        if: steps.guard.outputs.skip != 'true'
        run: pip install requests reportlab

      - name: 랭킹 계산 + 공시 감시 + 리포트
        if: steps.guard.outputs.skip != 'true'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python whale40.py

      - name: 결과 저장
        if: always() && steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "whale40-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A data report 2>/dev/null || true
          git diff --cached --quiet || git commit -m "daily $(date -u +%F)"
          git pull --rebase --autostash || true
          git push || true
