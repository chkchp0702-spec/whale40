name: whale40 daily

on:
  schedule:
    # GitHub는 붐비면 자동 실행을 몇 시간씩 미룬다. 네 번 걸어두고 제일 먼저 도는 것 하나만 보낸다.
    - cron: "17 22 * * *"     # 한국 07:17
    - cron: "17 23 * * *"     # 한국 08:17
    - cron: "17 0 * * *"      # 한국 09:17
    - cron: "37 1 * * *"      # 한국 10:37 (예비)
  workflow_dispatch:
    inputs:
      debug:
        description: "자세한 로그"
        required: false
        default: "false"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: whale40
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 한글 폰트 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-nanum fonts-nanum-coding
          sudo fc-cache -f

      - name: 라이브러리 설치
        run: |
          pip install --quiet requests reportlab playwright
          python -m playwright install --with-deps chromium || echo "playwright 크롬 설치 실패 — 시스템 크롬으로 인쇄"

      - name: 캐시 복원
        uses: actions/cache@v4
        with:
          path: |
            cache
            data
          key: whale40-${{ github.run_id }}
          restore-keys: whale40-

      - name: 실행
        env:
          TZ: Asia/Seoul
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          SEC_PROXY: ${{ secrets.SEC_PROXY }}
          SEC_PROXY_KEY: ${{ secrets.SEC_PROXY_KEY }}
          DEBUG: ${{ github.event.inputs.debug }}
        run: python whale40.py

      - name: 결과 커밋 (리포트 · 데이터 · 모바일 페이지)
        run: |
          git config user.name "whale40 bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A report data docs || true
          git diff --staged --quiet || git commit -m "리포트 $(date -u +%Y-%m-%d)"
          git push || true

      - name: GitHub Pages 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: run
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - id: dep
        uses: actions/deploy-pages@v4
